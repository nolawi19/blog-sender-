# Redis tuned for BullMQ queues (mounted by docker-compose.yml).

# BullMQ requires noeviction: evicting queue keys silently loses jobs.
maxmemory 512mb
maxmemory-policy noeviction

# Durability: append-only file fsynced every second. A crash can lose at most
# ~1 s of enqueued jobs; "always" is safer but adds latency to every write.
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
# AOF is the persistence mechanism; skip RDB snapshots (fork latency spikes).
save ""

# Networking
bind 0.0.0.0
protected-mode no
tcp-keepalive 60
timeout 0
tcp-backlog 511

# Free memory in the background instead of blocking the event loop.
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes

# Observability: record events slower than 10 ms / commands slower than 5 ms.
latency-monitor-threshold 10
slowlog-log-slower-than 5000
slowlog-max-len 256
