# Development override: publish PostgreSQL and Redis on localhost only, so the
# gateway and worker can run on the host with `npm run dev:gateway` / `dev:worker`.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis
services:
  postgres:
    ports: ["127.0.0.1:5432:5432"]
  redis:
    ports: ["127.0.0.1:6379:6379"]
